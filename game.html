<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Intuition Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 40px;
        background-color: #cdc3b6;
      }
      h1 { color: #660466; }
      button {
        font-size: 18px;
        padding: 8px 14px;
        border-radius: 8px;
        border: none;
        background-color: rgb(233, 144, 245);
        cursor: pointer;
      }

      .cards {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin: 25px 0;
      }
      .card {
        width: 150px;
        height: 150px;
        background-color: #660466;
        color: white;
        font-size: 60px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        overflow: hidden;
      }
      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      nav {
        display: flex;
        gap: 20px;
        justify-content: center;
        padding: 12px;
        background-color: #660466;
        border-radius: 10px;
        margin: 0 20px 20px;
      }
      nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
      }
      nav a:hover { text-decoration: underline; }

      @media (max-width: 500px) {
        .card {
          width: 95px;
          height: 95px;
          font-size: 40px;
        }
        h1 { font-size: 26px; }
        nav { gap: 10px; font-size: 14px; }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html">Home</a>
      <a href="game.html">Intuition Test</a>
      <a href="guess.html">Guess the Number</a>
      <a href="memory.html">Memory Match</a>
      <a href="quiz.html">Quiz</a>
      <a href="snake.html">Snake</a>
    </nav>

    <h1>Play Intuition Test</h1>

    <p>One card hides a rose. Trust your intuition and pick one!</p>
    <div class="cards" id="cards"></div>
    <p id="pictureMessage"></p>
    <p>Right guesses this visit: <span id="score">0</span></p>
    <button id="pictureAgain">Play again</button>

    <script>
      const scoreText = document.getElementById("score");
let score = Number(sessionStorage.getItem("roseScore")) || 0;
scoreText.textContent = score;
      const pictures = [
        { src: "rose.jpg", isRose: true },
        { src: "leaf.jpg", isRose: false },
        { src: "stone.jpg", isRose: false }
      ];

      const cardsBox = document.getElementById("cards");
      const pictureMessage = document.getElementById("pictureMessage");
      let picked = false;
      let lastRosePosition = -1;

      // A fair shuffle (Fisher-Yates)
      function shuffle(list) {
        const copy = list.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = copy[i];
          copy[i] = copy[j];
          copy[j] = temp;
        }
        return copy;
      }

      function startPictureGame() {
        picked = false;
        cardsBox.innerHTML = "";
        pictureMessage.textContent = "";

        // keep shuffling until the rose is in a NEW position
        let shuffled;
        let rosePosition;
        do {
          shuffled = shuffle(pictures);
          rosePosition = shuffled.findIndex(function (pic) {
            return pic.isRose;
          });
        } while (rosePosition === lastRosePosition);

        lastRosePosition = rosePosition;

        const cardElements = [];

        function showPicture(card, pic) {
          card.textContent = "";
          const img = document.createElement("img");
          img.src = pic.src;
          card.appendChild(img);
        }

        shuffled.forEach(function (pic) {
          const card = document.createElement("div");
          card.className = "card";
          card.textContent = "❓";
          cardElements.push(card);

          card.addEventListener("click", function () {
            if (picked) return;
            picked = true;

            showPicture(card, pic);

            if (pic.isRose) {
              pictureMessage.textContent = "🌹 You found the rose! Great intuition!";
              pictureMessage.style.color = "green";
              if (pic.isRose) {
  pictureMessage.textContent = "🌹 You found the rose! Great intuition!";
  pictureMessage.style.color = "green";
  score = score + 1;
  sessionStorage.setItem("roseScore", score);
  scoreText.textContent = score;
}
            } else {
              pictureMessage.textContent = "Not this one! Here is where the rose was:";
              pictureMessage.style.color = "red";

              cardElements.forEach(function (otherCard, index) {
                if (otherCard !== card) {
                  showPicture(otherCard, shuffled[index]);
                }
              });
            }
          });

          cardsBox.appendChild(card);
        });
      }

      document.getElementById("pictureAgain").addEventListener("click", startPictureGame);
      startPictureGame();
    </script>
    <script src="theme.js"></script>
  </body>
</html>
